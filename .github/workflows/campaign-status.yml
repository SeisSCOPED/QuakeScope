name: Campaign status

# Hourly report of what the picking campaigns have actually written to S3.
#
# Every figure is counted from an S3 or Batch API response - shards planned,
# shards complete, claims outstanding, picks recorded in the manifests, Parquet
# objects and their size. Nothing is estimated or carried over between runs.
#
# Notification model: ONE issue is the live dashboard, its body always showing
# the current state. A comment is posted EVERY hour, which emails everyone
# subscribed - the report is wanted hourly whether or not anything moved, so a
# quiet hour says "no change" rather than saying nothing. Comments are labelled
# so progress, no-change and needs-attention are distinguishable at a glance.
#
# This does mean 24 emails a day while a campaign runs. To go back to
# change-only mail, restore the `if (changed || attention)` guard around
# createComment in the final step.
#
# Subscribe: open the dashboard issue once and click Subscribe. GitHub mails
# comments to subscribers; there is no SMTP to configure.
#
# Needs the same credentials as aws-watch: AWS_WATCH_ROLE_ARN (OIDC) or the
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets. The role needs read access
# to the picks bucket in addition to Batch describe.

on:
  schedule:
    # Every three hours, not hourly. A full render walks 316,467 pick
    # objects and takes about 2.5 HOURS, so an hourly trigger queued behind
    # the previous one and each new arrival cancelled the one waiting: five
    # consecutive runs cancelled on 2026-09-05 and the published page went
    # two hours stale while showing a status that had changed. A schedule
    # slower than the job is the minimum for it to ever finish; making the
    # render read manifests instead of Parquet footers is the actual fix.
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write        # commits the rebuilt dashboard
  issues: write
  id-token: write
  actions: write         # dispatches pages.yml - see the publish step

concurrency:
  group: campaign-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # obspy/s3fs/pandas are only needed for the waveform examples on the
      # dashboard; the text status needs boto3 alone and still runs if the
      # heavier install fails.
      - run: pip install --quiet boto3 pandas pyarrow s3fs obspy

      - name: Check credentials are configured
        id: creds
        env:
          ROLE: ${{ vars.AWS_WATCH_ROLE_ARN }}
          KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -n "$ROLE" ]; then echo "mode=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "$KEY" ]; then echo "mode=keys" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            {
              echo "## Campaign status is not configured yet"
              echo
              echo "No AWS credentials, so nothing was read. Set \`AWS_WATCH_ROLE_ARN\`"
              echo "(OIDC) or the access-key secrets - the same ones aws-watch uses."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Campaign status has no credentials; skipping."
          fi

      - name: Configure AWS (OIDC)
        if: steps.creds.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_WATCH_ROLE_ARN }}
          aws-region: us-east-2
          # The default session is one hour and this job now outlives it.
          # western holds 129,831 Parquet objects whose footers have to be
          # read, and it is counted last, so on 2026-09-04 the credentials
          # expired mid-count and the page reported western as 0 picks with an
          # "could not be read" note - honest, but wrong-looking, while 11.7 GB
          # of picks sat in the bucket.
          role-duration-seconds: 21600

      - name: Configure AWS (access keys)
        if: steps.creds.outputs.mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Read campaign state
        id: report
        if: steps.creds.outputs.mode != 'none'
        run: |
          python scripts/campaign_status.py --markdown > status.md
          # The signature changes only when a number that matters changes; it is
          # what decides whether to email, so an idle hour stays quiet.
          echo "sig=$(grep -o 'sig:[^ ]*' status.md | tail -1)" >> "$GITHUB_OUTPUT"
          if grep -q '^#### Needs attention' status.md; then
            echo "attention=true" >> "$GITHUB_OUTPUT"
          else
            echo "attention=false" >> "$GITHUB_OUTPUT"
          fi
          cat status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Rebuild and publish the dashboard
        if: steps.creds.outputs.mode != 'none'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Sync BEFORE generating. The dashboard is a generated file that is
          # committed, so generating first and rebasing after guarantees a
          # conflict against anyone else's rebuild - on a file neither side
          # edited. Rebasing first means there is nothing to conflict with.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"

          # --examples fetches real day files from the public archives; a
          # failure there must not fail the run, so the generator degrades to a
          # page without examples rather than raising.
          python scripts/campaign_dashboard.py -o reports/campaign_dashboard.html

          if git diff --quiet -- reports/campaign_dashboard.html; then
            echo "dashboard unchanged; nothing to publish"
          else
            git add reports/campaign_dashboard.html
            git commit -m "Campaign dashboard: hourly rebuild [skip ci]"

            # Retry the push, rebasing each time.
            #
            # The pull above happens BEFORE generation, and generation takes
            # 30-60 minutes against a campaign-sized bucket. Anyone pushing in
            # that window makes this push non-fast-forward, and the run fails
            # having done all the work - which is exactly what happened to the
            # three scheduled runs on 2026-09-02, so the dashboard silently
            # stopped updating for most of a day while showing no error anyone
            # was watching.
            #
            # `-X theirs` during a rebase favours the commit being replayed,
            # which is OURS. That is the right resolution for a generated file:
            # our copy was produced from a strictly later view of S3, so if two
            # rebuilds race, the newer one should win rather than conflict.
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed=1
                break
              fi
              echo "push rejected (attempt ${attempt}) - rebasing onto the new tip"
              if ! git pull --rebase -X theirs --autostash origin "${GITHUB_REF_NAME}"; then
                git rebase --abort || true
                echo "::error::could not rebase the dashboard onto ${GITHUB_REF_NAME}"
                exit 1
              fi
              sleep $((attempt * 5))
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::dashboard rebuilt but could not be pushed after 5 attempts"
              exit 1
            fi

            # Publish it. The commit above carries [skip ci], which GitHub
            # applies to EVERY workflow on that push - including pages.yml, so
            # the rebuilt page reached the repository and never reached the
            # site. https://seisscoped.org/QuakeScope/campaign_dashboard.html
            # sat unchanged from 2026-09-03T02:36 while the hourly job kept
            # succeeding, because the last thing to publish it was a human
            # pushing to reports/.
            #
            # [skip ci] has to stay: docker.yml triggers on any push to main
            # with no path filter, so dropping it would rebuild the container
            # image every hour. Dispatch pages.yml explicitly instead - it is
            # the one workflow this push actually needs.
            gh workflow run pages.yml --ref "${GITHUB_REF_NAME}" || \
              echo "::warning::could not dispatch pages.yml - committed, not published"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update the dashboard issue
        if: steps.creds.outputs.mode != 'none'
        uses: actions/github-script@v7
        env:
          SIG: ${{ steps.report.outputs.sig }}
          ATTENTION: ${{ steps.report.outputs.attention }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('status.md', 'utf8');
            const TITLE = 'Campaign status dashboard';
            const LABEL = 'campaign-status';
            const sig = process.env.SIG || '';
            const attention = process.env.ATTENTION === 'true';

            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue label:${LABEL}`,
            });
            let issue = found.data.items[0];
            const full = `${body}\n\n---\n_Updated ${new Date().toISOString()} by ` +
              `[campaign-status](../actions/workflows/campaign-status.yml). ` +
              `Subscribe to this issue to be emailed when the numbers change._`;

            if (!issue) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: TITLE, body: full, labels: [LABEL],
              });
              core.info(`created dashboard #${created.data.number}`);
              return;
            }

            // The previous signature is carried in the issue body, so no state
            // is stored anywhere else and a re-run cannot double-notify.
            const prev = (issue.body || '').match(/sig:[^\s]*/);
            const changed = !prev || prev[0] !== sig;

            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number, body: full,
            });

            // Comment on EVERY run, so the hourly report is an hourly email
            // rather than a silence you have to trust. `changed` is still used,
            // but only to label the comment - an hour with no movement says so
            // plainly instead of looking identical to one with progress.
            const header = attention
              ? '**Needs attention.**'
              : (changed ? '**Progress since the last check.**'
                         : '_No change in the last hour._');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number,
              body: `${header}\n\n${body}`,
            });
