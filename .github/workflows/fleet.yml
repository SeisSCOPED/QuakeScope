name: "▶ Run or stop a campaign (Fleet)"

# Holds the campaign fleets at their target size, and lets you change that
# target from anywhere - including the GitHub mobile app, which is the point.
#
# WHY THIS AND NOT A SERVER. Batch caps retryStrategy.attempts at 10 and will
# not raise it, so on a pool reclaiming 37-53% of attempts a worker's whole life
# is about ten reclaims, after which it fails permanently and nothing replaces
# it. Something outside Batch has to resubmit. That something was going to be a
# small EC2 box running the governor loop; it is this instead, because a box is
# one more thing to keep alive, it fails silently when it dies, and you cannot
# scale it from a phone.
#
# The trade is cadence. GitHub's scheduler delays cron under load - we have seen
# an hourly job land 40 minutes late - so the fleet sags between runs rather
# than sitting exactly on target. That is throughput variance, not failure: the
# queue is durable and every top-up brings it back. A fleet that oscillates
# between 60 and 100 workers finishes; a fleet nobody notices has died does not.
#
# TO CHANGE THE FLEET, from a phone or anywhere:
#   Actions -> Fleet -> Run workflow -> pick campaign + target -> Run
# Manual runs are limited to the operators in ALLOWED below. The schedule is
# not: it keeps holding whatever target is committed, with nobody present.
# The target you may ask for is bounded by the LIVE quota - maxVcpus divided by
# the task size, less what the other campaigns hold and anything else in the
# queue - so the three campaigns cannot between them oversubscribe it.
# The change is committed to fleet.json, so that file is the audit trail of who
# scaled what and when. target 0 stops a campaign without losing its place.

run-name: >-
  ${{ github.event_name == 'schedule'
      && 'Scheduled top-up'
      || format('{0} → {1} workers · by {2}', inputs.campaign, inputs.target, github.actor) }}

on:
  schedule:
    - cron: "*/15 * * * *"     # top up; offset from the other jobs by minute
  workflow_dispatch:
    inputs:
      campaign:
        description: "Campaign. Start with dryrun3 if you are unsure - it is a tiny test queue."
        required: true
        type: choice
        options: [western, global, obs, dryrun3, dryrun4]
      target:
        description: "How many workers. 0 stops new ones. First run of a campaign starts an access survey instead."
        required: true
        type: string
        default: "0"

permissions:
  contents: write        # commits the new target to fleet.json
  id-token: write        # OIDC to assume the AWS role

concurrency:
  group: fleet
  cancel-in-progress: false

jobs:
  fleet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WHO may change the fleet, as distinct from the guard below, which
      # bounds HOW MUCH. workflow_dispatch needs write access and this
      # repository has 11 collaborators with it, so write access alone is a
      # wider door than spending money should have.
      #
      # Hardcoded here on purpose, not in fleet.json and not in a repository
      # variable. fleet.json is edited BY this workflow, so an allowlist living
      # there could rewrite itself; a variable can be changed silently in
      # settings. In the workflow file, adding an operator is a commit somebody
      # can review.
      #
      # This gates manual runs only. The schedule keeps topping up to whatever
      # target is already committed, so nobody has to be around for the fleet
      # to hold.
      - name: Only an approved operator may change the fleet
        if: github.event_name == 'workflow_dispatch'
        env:
          ACTOR: ${{ github.actor }}
        run: |
          ALLOWED="mdenolle"
          for who in $ALLOWED; do
            if [ "$who" = "$ACTOR" ]; then
              echo "operator: $ACTOR"
              exit 0
            fi
          done
          echo "::error::$ACTOR is not an approved fleet operator."
          echo "::error::Approved: $ALLOWED. To add someone, edit ALLOWED in"
          echo "::error::.github/workflows/fleet.yml - it is a reviewable commit."
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet boto3 pandas

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # vars, NOT secrets: the role ARN is a repository VARIABLE here, as
          # campaign-status.yml uses it. Written as secrets.* it resolves to an
          # empty string, configure-aws-credentials silently skips assuming
          # anything, and the failure surfaces two steps later as
          # NoCredentialsError.
          role-to-assume: ${{ vars.AWS_WATCH_ROLE_ARN }}
          aws-region: us-east-2

      # WHAT MAY RUN, as distinct from the operator gate above (WHO) and the
      # quota guard below (HOW MUCH).
      #
      # On 2026-09-04 the EarthScope credential client in image c5846f3 was
      # reported to us as a denial of service, the fleet was taken to 0, and an
      # incident report was written saying so. Nothing in this repository stopped
      # that image from being launched again: the three targets in fleet.json
      # were zeros, and one dispatch of this workflow - from a phone, which is
      # the point of it - would have put 208 workers back on the same build.
      # A promise in a report is not a control. This is the control.
      #
      # Hardcoded here for the same reason ALLOWED is: fleet.json is written BY
      # this workflow, so a quarantine kept there could lift itself, and a
      # repository variable can be changed in settings with no commit. Removing
      # a tag from this list is a reviewable diff.
      #
      # It reads the image out of the job definition revision that fleet.json
      # actually names, live, rather than trusting fleet.json to describe what
      # Batch would run.
      - name: Refuse to launch a quarantined image
        env:
          CAMPAIGN: ${{ inputs.campaign }}
          TARGET: ${{ inputs.target }}
        run: |
          python - <<'PY'
          import json, os, sys
          import boto3

          QUARANTINE = {
              "c5846f3":
                  "the EarthScope credential client in this build retries "
                  "400/403/404 once per station-day, drops the year from "
                  "temporary-network requests that then cannot succeed, and "
                  "re-presents a rejected refresh token five times per scope. "
                  "On 2026-09-04 it sent 260,322 token requests in 66 minutes "
                  "and EarthScope reported the fleet as a denial of service. "
                  "Fixed in PR #32; this tag predates the fix. See "
                  "reports/earthscope_credential_audit.html.",
          }

          d = json.load(open("fleet.json"))["campaigns"]
          camp, target = os.environ.get("CAMPAIGN"), os.environ.get("TARGET")

          # What this run would actually leave running: the committed targets,
          # with the requested one substituted in. Catches both paths - the
          # dispatch that raises a target, and the schedule topping up a target
          # that is already non-zero.
          effective = {k: v["target"] for k, v in d.items()}
          if camp and target and camp in effective:
              effective[camp] = int(target)

          b = boto3.client("batch", region_name="us-east-2")
          blocked = []
          for name, n in effective.items():
              if n <= 0:
                  continue
              jd = d[name]["job_definition"]
              jdef = b.describe_job_definitions(
                  jobDefinitions=[jd])["jobDefinitions"][0]
              image = jdef["containerProperties"]["image"]
              tag = image.rsplit(":", 1)[-1]
              print(f"{name}: target {n} -> {jd} -> {image}")
              if tag in QUARANTINE:
                  blocked.append((name, n, jd, image, tag))

          for name, n, jd, image, tag in blocked:
              print(f"::error::{name} (target {n}) would run {jd}, which is "
                    f"image {image}. Tag {tag} is quarantined: "
                    f"{QUARANTINE[tag]}")

          if blocked:
              print("::error::Register a job definition revision on a build "
                    "that carries the fix and point fleet.json at it. Do not "
                    "remove the tag from QUARANTINE to get past this.")
              sys.exit(1)

          print("::notice::no quarantined image would run")
          PY

      # HOW MUCH TRAFFIC WE ARE ALREADY MAKING, as distinct from the guards
      # above. On 2026-09-04 the fleet sent 351,735 token requests to
      # EarthScope over four hours and nobody here noticed - the archive
      # operator told us. Nothing in the stack alarmed.
      #
      # A CloudWatch metric filter with an alarm is the textbook control and
      # needs permissions this account may not have. This workflow already runs
      # every 15 minutes with credentials and already knows how to set targets
      # to zero, so the check lives here instead. It is weaker than an alarm -
      # 15-minute granularity, and it stops the fleet rather than paging a
      # human - but the incident ran for four hours, so 15 minutes would have
      # caught it early.
      #
      # THRESHOLD. The incident sustained 2,193 requests/min and peaked at
      # 5,104. Ordinary traffic is far below: a whole fleet restarting
      # bootstraps OAuth once per process, roughly 800 requests spread over a
      # few minutes, and dryrun4 sent 11 in 1h45m. 500/min therefore sits about
      # 10x above a legitimate restart burst and 4x below the incident.
      - name: Stop the fleet if we are hammering EarthScope
        env:
          ES_RATE_LIMIT_PER_MIN: ${{ vars.ES_RATE_LIMIT_PER_MIN || '500' }}
        run: |
          python - <<'PY'
          import datetime, json, os, subprocess, sys
          import boto3

          WINDOW_MIN = 15
          limit = float(os.environ["ES_RATE_LIMIT_PER_MIN"])
          logs = boto3.client("logs", region_name="us-east-2")
          end = int(datetime.datetime.now(datetime.timezone.utc).timestamp() * 1000)
          start = end - WINDOW_MIN * 60 * 1000

          # A CloudWatch hiccup must not zero a healthy fleet. Anything other
          # than a clean answer is treated as "no evidence of a problem".
          try:
              n, tok = 0, None
              while True:
                  kw = dict(logGroupName="/aws/batch/job", startTime=start,
                            endTime=end, limit=10000,
                            filterPattern='"POST https://login.earthscope.org/oauth/token"')
                  if tok:
                      kw["nextToken"] = tok
                  r = logs.filter_log_events(**kw)
                  n += len(r.get("events", []))
                  tok = r.get("nextToken")
                  if not tok:
                      break
          except Exception as exc:
              print(f"::warning::could not read the token rate ({exc}); "
                    f"not acting on it")
              raise SystemExit(0)

          rate = n / WINDOW_MIN
          print(f"::notice::EarthScope token endpoint: {n:,} requests in the "
                f"last {WINDOW_MIN} min = {rate:,.0f}/min (limit {limit:,.0f})")
          if rate <= limit:
              raise SystemExit(0)

          d = json.load(open("fleet.json"))
          live = {k: v["target"] for k, v in d["campaigns"].items() if v["target"] > 0}
          for v in d["campaigns"].values():
              v["target"] = 0
          json.dump(d, open("fleet.json", "w"), indent=2)
          open("fleet.json", "a").write("\n")
          print(f"::error::{rate:,.0f} token requests/min exceeds {limit:,.0f}. "
                f"Every campaign target set to 0 (was {live}). This is the "
                f"2026-09-04 shape: see reports/earthscope_credential_audit.html "
                f"before restarting anything.")
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email",
                          "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "fleet.json"], check=True)
          subprocess.run(["git", "commit", "-m",
                          f"Fleet: stopped automatically, {rate:.0f} token req/min [skip ci]"],
                         check=True)
          for _ in range(3):
              if subprocess.run(["git", "push", "origin",
                                 f"HEAD:{os.environ['GITHUB_REF_NAME']}"]).returncode == 0:
                  break
              subprocess.run(["git", "pull", "--rebase", "-X", "theirs", "--autostash",
                              "origin", os.environ["GITHUB_REF_NAME"]])
          sys.exit(1)
          PY

      # WHETHER THE DATA IS THERE, as distinct from whether we may run
      # (operator), what would run (quarantine) and how loudly (rate).
      #
      # EarthScope embargoes recent years of a temporary FDSN code and opens
      # them later, and codes are reused between experiments, so "we planned
      # this network-year" and "we may read it today" are different questions.
      # Nothing asked the second one. On 2026-09-05 a 57-worker fleet spent an
      # hour discovering the answer one shard at a time: 2,010 of 2,506 shard
      # failures were embargoed years of 7D and 2F.
      #
      # `netyear-sweep` asks it properly - one cheap credential request per
      # (network, year), paced. ~1,600 pairs is about seven minutes on one
      # worker and costs pennies. So: no survey, no fleet. The first dispatch
      # runs the survey instead of the campaign and says so; the second reads
      # it and either launches or explains why it will not.
      - name: Do we actually have the data?
        id: access
        if: github.event_name == 'workflow_dispatch' && inputs.target != '0'
        env:
          CAMPAIGN: ${{ inputs.campaign }}
          TARGET: ${{ inputs.target }}
          ACCESS_MAX_AGE_DAYS: ${{ vars.ACCESS_MAX_AGE_DAYS || '30' }}
          ACCESS_MIN_READABLE: ${{ vars.ACCESS_MIN_READABLE || '0.10' }}
        run: |
          python - <<'PY'
          import datetime, json, os, sys
          import boto3

          camp = os.environ["CAMPAIGN"]
          max_age = float(os.environ["ACCESS_MAX_AGE_DAYS"])
          floor = float(os.environ["ACCESS_MIN_READABLE"])
          BUCKET = "quakescope-picks-2026"
          key = f"{camp}/access.json"
          s3 = boto3.client("s3")
          cfg = json.load(open("fleet.json"))["campaigns"][camp]

          def say(md):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write(md + "\n")

          def submit_survey(why):
              b = boto3.client("batch", region_name="us-east-2")
              r = b.submit_job(
                  jobName=f"survey-{camp}",
                  jobQueue="niyiyu_earthscope_missing_station",
                  jobDefinition=cfg["job_definition"],
                  containerOverrides={"command": [
                      "netyear-sweep",
                      "--campaign", f"s3://{BUCKET}/{camp}",
                      "--out", f"s3://{BUCKET}/{key}",
                      "--pace", "0.25"]})
              # SUCCEED. This step did something useful and deliberate; a red
              # run tells the person holding the phone that it broke.
              print(f"::notice::{why} Started an access survey instead "
                    f"(job {r['jobId'][:8]}). Nothing was launched.")
              say(f"## ⏳ Checking access to {camp} first\n\n"
                  f"{why}\n\n"
                  f"An access survey is running now — about **2 minutes**. It "
                  f"asks EarthScope which of this campaign's network-years we "
                  f"may actually read, so workers are not started on data that "
                  f"is embargoed.\n\n"
                  f"### What to do\n"
                  f"**Wait ~2 minutes, then run this workflow again** with the "
                  f"same settings. It will use the survey and launch.\n\n"
                  f"_Nothing was started, and nothing is costing money._")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("launch=no\n")

          try:
              obj = s3.get_object(Bucket=BUCKET, Key=key)
          except Exception:
              submit_survey(f"{camp} has never been surveyed.")
              sys.exit(0)

          # Seconds, floored at 0: a survey written moments ago has a tiny
          # negative timedelta and `.days` rounds that to -1.
          age = max(0.0, (datetime.datetime.now(datetime.timezone.utc)
                          - obj["LastModified"]).total_seconds() / 86400)
          if age > max_age:
              submit_survey(f"The survey for {camp} is {age:.0f} days old "
                            f"(limit {max_age:.0f}), and embargoes move.")
              sys.exit(0)

          a = json.load(obj["Body"])
          present = a.get("present", 0)
          denied, missing = len(a.get("denied", [])), len(a.get("missing", []))
          checked = a.get("checked") or (present + denied + missing) or 1
          frac = present / checked
          print(f"::notice::{camp}: survey {age:.1f} day(s) old — {present} of "
                f"{checked} network-years readable ({frac:.0%}), {denied} "
                f"embargoed or denied, {missing} not in the archive.")

          if frac < floor:
              print(f"::error::Only {frac:.0%} of {camp}'s planned network-years "
                    f"are readable, below the {floor:.0%} floor. {os.environ['TARGET']} "
                    f"workers would spend most of their time on data we cannot "
                    f"read. Re-plan the campaign, or ask EarthScope about the "
                    f"embargoed years, before launching. Nothing was launched.")
              say(f"## 🛑 Not launching {camp}\n\n"
                  f"Only **{frac:.0%}** of this campaign's network-years are "
                  f"readable today, below the {floor:.0%} floor.\n\n"
                  f"{denied} are embargoed or denied and {missing} are not in "
                  f"the archive. Starting {os.environ['TARGET']} workers would "
                  f"spend most of their time on data we cannot read.\n\n"
                  f"_Nothing was started._")
              sys.exit(1)
          say(f"## ✅ Launching {camp}\n\n"
              f"**{present} of {checked}** network-years are readable "
              f"({frac:.0%}). Survey is {age:.1f} day(s) old.\n\n"
              f"Embargoed years are skipped on first contact rather than "
              f"retried, so they cost nothing.")
          if frac < 0.5:
              print(f"::warning::{camp} is only {frac:.0%} readable. Embargoed "
                    f"shards are blocked on first contact rather than retried, "
                    f"so this is not wasteful - but the campaign will finish "
                    f"well short of its plan until those years open.")
          PY

      # A manual run edits the target first, so the top-up below uses the new
      # value in the same run - press the button, see it take effect.
      - name: Set the new target
        if: github.event_name == 'workflow_dispatch' && steps.access.outputs.launch != 'no'
        env:
          CAMPAIGN: ${{ inputs.campaign }}
          TARGET: ${{ inputs.target }}
        run: |
          python - <<'PY'
          import json, os
          camp, target = os.environ["CAMPAIGN"], int(os.environ["TARGET"])
          d = json.load(open("fleet.json"))
          if camp not in d["campaigns"]:
              raise SystemExit(f"unknown campaign {camp}")

          # The ceiling is the QUOTA, read live, not a number somebody typed
          # here. Batch will not run more than maxVcpus anyway - asking for more
          # just queues workers that sit RUNNABLE - so the real limit is
          #
          #     maxVcpus / vCPU-per-task  -  everything else already in the queue
          #
          # and the budget is FLEET-WIDE: three campaigns share one queue, so
          # what this campaign may have is the ceiling minus what the others are
          # already holding. A per-campaign cap would let their sum exceed the
          # quota and silently starve whichever asked last.
          import boto3, collections
          b = boto3.client("batch", region_name="us-east-2")
          Q = "niyiyu_earthscope_missing_station"
          q = b.describe_job_queues(jobQueues=[Q])["jobQueues"][0]
          ce = b.describe_compute_environments(computeEnvironments=[
              q["computeEnvironmentOrder"][0]["computeEnvironment"]
          ])["computeEnvironments"][0]
          maxv = ce["computeResources"]["maxvCpus"]

          jd = d["campaigns"][camp]["job_definition"].split(":")[0]
          jdef = max(b.describe_job_definitions(jobDefinitionName=jd,
                     status="ACTIVE")["jobDefinitions"],
                     key=lambda x: x["revision"])
          vcpu = int([x["value"] for x in
                      jdef["containerProperties"]["resourceRequirements"]
                      if x["type"] == "VCPU"][0])
          ceiling = maxv // vcpu

          # Anything in the queue that is not one of our campaigns - a
          # diagnostic, a sweep, somebody else's job - is capacity we do not
          # have. Counted live rather than assumed.
          names = tuple(d["campaigns"])
          foreign = 0
          for st in ("SUBMITTED","PENDING","RUNNABLE","STARTING","RUNNING"):
              tok = None
              while True:
                  kw = dict(jobQueue=Q, jobStatus=st, maxResults=100)
                  if tok: kw["nextToken"] = tok
                  r = b.list_jobs(**kw)
                  foreign += sum(1 for j in r["jobSummaryList"]
                                 if not j["jobName"].startswith(names))
                  tok = r.get("nextToken")
                  if not tok: break

          others = sum(v["target"] for k, v in d["campaigns"].items() if k != camp)
          allowed = ceiling - foreign - others
          print(f"::notice::quota {maxv:,} vCPU / {vcpu} per task = {ceiling:,} "
                f"workers; {others} held by other campaigns, {foreign} foreign "
                f"jobs -> {camp} may have up to {allowed:,}")

          if target < 0:
              raise SystemExit(f"target must be >= 0, got {target}")
          if target > allowed:
              raise SystemExit(
                  f"target {target} exceeds what is available: {allowed:,} "
                  f"({ceiling:,} from the {maxv:,}-vCPU quota, less {others} "
                  f"held by other campaigns and {foreign} foreign jobs). "
                  f"Lower another campaign first, or raise the quota.")

          old = d["campaigns"][camp]["target"]
          d["campaigns"][camp]["target"] = target
          json.dump(d, open("fleet.json", "w"), indent=2)
          print(f"::notice::{camp}: target {old} -> {target}")
          PY
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          if ! git diff --quiet -- fleet.json; then
            git add fleet.json
            git commit -m "Fleet: ${{ inputs.campaign }} target -> ${{ inputs.target }} [skip ci]"
            for i in 1 2 3; do
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
              git pull --rebase -X theirs --autostash origin "${GITHUB_REF_NAME}"
            done
          fi

      - name: Top up every campaign to its target
        if: steps.access.outputs.launch != 'no'
        run: |
          python - <<'PY'
          import json, subprocess, sys
          cfg = json.load(open("fleet.json"))["campaigns"]
          rc = 0
          for name, c in cfg.items():
              if c["target"] <= 0:
                  print(f"--- {name}: target 0, not running")
                  continue
              print(f"--- {name}: target {c['target']}")
              # --once: submit what is missing and exit. The schedule is the
              # loop, so the workflow never holds a runner open.
              r = subprocess.run([
                  sys.executable, "scripts/spot_governor.py",
                  "--campaign", f"s3://quakescope-picks-2026/{name}",
                  "--job-definition", c["job_definition"],
                  "--weight", c["weight"],
                  "--procs", str(c["procs"]), "--threads", str(c["threads"]),
                  "--target", str(c["target"]),
                  "--name-prefix", name,
                  "--max-submissions", str(c["target"]),   # per run, not per life
                  "--once",
              ])
              rc |= r.returncode
          sys.exit(rc)
          PY

      - name: Report the fleet
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, boto3
          from sb_catalog.src.s3_state import S3CampaignState
          b = boto3.client("batch", region_name="us-east-2")
          cfg = json.load(open("fleet.json"))["campaigns"]
          print("| campaign | target | alive | shards done | remaining |")
          print("|---|--:|--:|--:|--:|")
          for name, c in cfg.items():
              alive = 0
              for st in ("SUBMITTED","PENDING","RUNNABLE","STARTING","RUNNING"):
                  tok = None
                  while True:
                      kw = dict(jobQueue="niyiyu_earthscope_missing_station",
                                jobStatus=st, maxResults=100)
                      if tok: kw["nextToken"] = tok
                      r = b.list_jobs(**kw)
                      alive += sum(1 for j in r["jobSummaryList"]
                                   if j["jobName"].startswith(name))
                      tok = r.get("nextToken")
                      if not tok: break
              try:
                  p = S3CampaignState(f"s3://quakescope-picks-2026/{name}").progress()
                  done, rem = p["complete"], p["remaining"]
              except Exception:
                  done = rem = "?"
              print(f"| {name} | {c['target']} | {alive} | {done:,} | {rem:,} |"
                    if isinstance(done, int) else
                    f"| {name} | {c['target']} | {alive} | {done} | {rem} |")
          PY
