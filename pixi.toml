[workspace]
name = "quakescope"
version = "2.0.0"
description = "Machine learning seismic phase picking at cloud scale"
authors = ["Yiyu Ni <niyiyu@uw.edu>", "Jannes Munchmeyer <munchmej@univ-grenoble-alpes.fr>", "Marine Denolle <mdenolle@uw.edu>"]
channels = ["conda-forge", "pytorch", "nvidia"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
channel-priority = "disabled"

[dependencies]
python = "3.10.*"
obspy = ">=1.4.0"
scipy = ">=1.10.0"
numpy = ">=1.24.0"
pandas = ">=1.5.0"
matplotlib = ">=3.7.0"
cartopy = ">=0.21.0"
s3fs = ">=2023.1.0"
boto3 = ">=1.35.0"
jupyter = ">=1.0.0"
jupyterlab = ">=3.6.0"
ipywidgets = ">=8.0.0"
ipykernel = ">=6.20.0"
tqdm = ">=4.65.0"
requests = ">=2.31.0"

[pypi-dependencies]
seisbench = ">=0.3.5"
pyocto = "*"
pymongo = ">=4.0"
earthscope-sdk = ">=1.0.0b0"

[feature.cpu.dependencies]
pytorch-cpu = ">=2.1"

[feature.gpu]
platforms = ["linux-64", "win-64"]

[feature.gpu.dependencies]
pytorch = ">=2.1"
pytorch-cuda = "==11.8"

[feature.dev.dependencies]
pytest = ">=7.0"
black = ">=23.0"
ruff = ">=0.1.0"

[environments]
tutorials = ["cpu"]
tutorials-gpu = ["gpu"]
cloud = ["cpu"]
dev = ["cpu", "dev"]

[tasks]
smoke-test = "jupyter notebook tutorials/phasenet_smoke_test_ridgecrest.ipynb"
compare-models = "jupyter notebook tutorials/compare_phasenet_models.ipynb"
lab = "jupyter lab"
install-kernel = "python -m ipykernel install --user --name quakescope-tutorials --display-name 'QuakeScope (tutorials)'"
