[workspace]
name = "quakescope"
version = "3.0.0"
description = "Machine learning seismic phase picking at cloud scale"
authors = ["Yiyu Ni <niyiyu@uw.edu>", "Jannes Munchmeyer <munchmej@univ-grenoble-alpes.fr>", "Marine Denolle <mdenolle@uw.edu>"]
channels = ["conda-forge", "pytorch", "nvidia"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
channel-priority = "disabled"

[dependencies]
python = "3.10.*"
obspy = ">=1.4.0"
scipy = ">=1.10.0"
numpy = ">=1.24.0"
pandas = ">=1.5.0"
matplotlib = ">=3.7.0"
cartopy = ">=0.21.0"
s3fs = ">=2023.1.0"
boto3 = ">=1.35.0"
jupyter = ">=1.0.0"
jupyterlab = ">=3.6.0"
ipywidgets = ">=8.0.0"
ipykernel = ">=6.20.0"
tqdm = ">=4.65.0"
requests = ">=2.31.0"
pyarrow = ">=14"
# Reading the Parquet catalogue: partition pruning and predicate pushdown over
# S3 without loading a campaign into memory. Used by notebooks/6_check_parquet.
duckdb = ">=0.10"
joblib = ">=1.3"

[pypi-dependencies]
seisbench = ">=0.3.5"
pyocto = "*"
pymongo = ">=4.0"
earthscope-sdk = ">=1.0.0b0"

[feature.cpu.dependencies]
pytorch-cpu = ">=2.1"

[feature.gpu]
platforms = ["linux-64", "win-64"]

[feature.gpu.dependencies]
pytorch = ">=2.1"
pytorch-cuda = "==11.8"

[feature.deploy.pypi-dependencies]
# Campaigns run on AWS Batch over Fargate Spot; boto3 is all that is needed.
# the jobs controller is what gives managed jobs their preemption recovery.

[feature.dev.dependencies]
pytest = ">=7.0"
black = ">=23.0"
ruff = ">=0.1.0"

[environments]
tutorials = ["cpu"]
tutorials-gpu = ["gpu"]
cloud = ["cpu"]
dev = ["cpu", "dev"]
deploy = ["deploy"]

[feature.deploy.tasks]
plan = "python -m sb_catalog.src.shard_planner"
progress = "python -c \"import sys;from sb_catalog.src.s3_state import S3CampaignState;print(S3CampaignState(sys.argv[1]).progress())\""

[tasks]
watch = "python scripts/aws_watch.py"
watch-md = "python scripts/aws_watch.py --format markdown"
smoke-test = "jupyter notebook tutorials/phasenet_smoke_test_ridgecrest.ipynb"
compare-models = "jupyter notebook tutorials/compare_phasenet_models.ipynb"
lab = "jupyter lab"
install-kernel = "python -m ipykernel install --user --name quakescope-cpu --display-name 'QuakeScope CPU (tutorials)'"
